<!DOCTYPE html>
<html lang="en" class="dark:bg-amber-500 bg-blue-500">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="output.css" /> -->
  </head>
  <script>
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    document.documentElement.classList.toggle(
      "dark",
      localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
    );
  </script>
  <body>
    <main>
      <div
        class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5"
      >
        <div>
          <span
            class="inline-flex items-center justify-center rounded-md bg-indigo-500 p-2 shadow-lg"
          >
            <svg class="h-6 w-6 stroke-white" ...></svg>
          </span>
        </div>
        <h3
          class="text-gray-900 dark:text-white mt-5 text-base font-medium tracking-tight"
        >
          Writes upside-down
        </h3>
        <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">
          The Zero Gravity Pen can be used to write in any orientation,
          including upside-down. It even works in outer space.
        </p>
      </div>
      <div>
        <button
          id="btn-dark"
          class="bg-gray-800 text-white dark:bg-pink-400 dark:text-gray-800 hover:bg-gray-700 dark:hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 rounded-md px-4 py-2 mt-4"
        >
          dark mode
        </button>
        <button
          id="btn-light"
          class="bg-amber-400 text-white dark:bg-green-400 dark:text-gray-800 hover:bg-amber-700 dark:hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 rounded-md px-4 py-2 mt-4"
        >
          light mode
        </button>
      </div>
    </main>
    <script>
      document
        .getElementById("btn-dark")
        .addEventListener("click", function () {
          document.documentElement.classList.add("dark");
          localStorage.setItem("theme", "dark");
        });
      document
        .getElementById("btn-light")
        .addEventListener("click", function () {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("theme", "light");
        });

      // Whenever the user explicitly chooses light mode
      localStorage.theme = "light";
      // Whenever the user explicitly chooses dark mode
      localStorage.theme = "dark";
      // Whenever the user explicitly chooses to respect the OS preference
      localStorage.removeItem("theme");
    </script>
  </body>
</html>
